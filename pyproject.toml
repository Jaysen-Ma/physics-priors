[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "physics-priors"
version = "0.1.0"
description = "Operator statistics and expression priors for physics equations"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "matplotlib",
    "numpy",
    "scipy",
    "sympy",
]

[project.urls]
Repository = "https://github.com/Jaysen-Ma/physics-priors"

[project.scripts]
physics-priors-catalog = "physics_priors.catalog:main"
physics-priors-fit = "physics_priors.analysis.exponential_bootstrap:main"
physics-priors-sbi-intervals = "physics_priors.analysis.sbi_intervals:main"
physics-priors-calibrate = "physics_priors.analysis.exponential_coverage_check:main"
physics-priors-compare = "physics_priors.analysis.prior_comparison:main"

[tool.setuptools.packages.find]
where = ["src"]
namespaces = false

[tool.setuptools]
include-package-data = false

[tool.setuptools.package-data]
"physics_priors.priors._katz" = ["LICENSE"]
