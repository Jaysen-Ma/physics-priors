name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analysis:
    name: Python 3.12 analysis
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      MPLBACKEND: Agg
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
    steps:
      - name: Check out the project
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check out catalogue test fixtures
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: andrei-const/physics-formulae-patterns
          ref: 2aa199b5a1d210dacd122f97c3e8086d3e54f752
          path: .scratch/physics-formulae-patterns
          sparse-checkout: |
            /data/Feynman.csv
            /data/Inflation.csv
            /data/Wiki.csv
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install the pinned analysis dependencies
        run: |
          python -m pip install -r requirements.txt

      - name: Build and install the package wheel
        run: |
          wheel_dir="$RUNNER_TEMP/physics-priors-wheel"
          python -m pip wheel --no-deps --wheel-dir "$wheel_dir" .
          python -m pip install --no-deps "$wheel_dir"/physics_priors-*.whl
          python -m pip check

      - name: Check the installed package outside the checkout
        working-directory: ${{ runner.temp }}
        run: |
          python -c 'from physics_priors import metalaw; assert metalaw.complexity("x+y") == 3'
          for command in physics-priors-catalog physics-priors-fit physics-priors-calibrate physics-priors-compare; do
            "$command" --help
            if "$command" > missing-checkout.log 2>&1; then
              echo "Expected a missing-checkout error from $command"
              exit 1
            fi
            grep -F "needs a physics-priors repository checkout" missing-checkout.log
          done

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Check analysis entry points
        run: |
          python -m physics_priors.catalog --help
          python scripts/analysis/exponential_bootstrap.py --help
          python scripts/analysis/exponential_coverage_check.py --help
          python scripts/exponential_bootstrap.py --help
          python scripts/exponential_coverage_check.py --help

      - name: Exercise the analysis workflows
        run: |
          physics-priors-fit --boot 32
          physics-priors-calibrate --datasets 2 --boot 8 --workers 1
          test -s results/exponential_fit/diagnostics/boot_32/summary.json
          test -s results/exponential_fit/diagnostics/coverage_2_8/coverage_check.json
          physics-priors-compare
          test -s results/prior_scoring/run/scores.csv
          python - <<'PY'
          import json
          from math import isclose
          from pathlib import Path

          saved = json.loads(Path("results/prior_scoring/summary.json").read_text())["overall"]
          actual = json.loads(Path("results/prior_scoring/run/summary.json").read_text())["overall"]
          assert actual["n_scores"] == saved["n_scores"]
          assert actual["by_branch"].keys() == saved["by_branch"].keys()
          for branch, expected in saved["by_branch"].items():
              assert isclose(actual["by_branch"][branch], expected, rel_tol=0, abs_tol=1e-5), branch
          PY
          git diff --exit-code
