name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analysis:
    name: Python 3.12 analysis
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      MPLBACKEND: Agg
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
    steps:
      - name: Check out the project
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check out catalogue test fixtures
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: andrei-const/physics-formulae-patterns
          ref: 2aa199b5a1d210dacd122f97c3e8086d3e54f752
          path: .scratch/physics-formulae-patterns
          sparse-checkout: |
            /data/Feynman.csv
            /data/Inflation.csv
            /data/Wiki.csv
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install the pinned analysis dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip check

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Check analysis entry points
        run: |
          python -m physics_metalaw.catalog --help
          python scripts/exponential_bootstrap.py --help
          python scripts/exponential_coverage_check.py --help

      - name: Run small analysis jobs
        run: |
          python scripts/exponential_bootstrap.py --boot 32
          python scripts/exponential_coverage_check.py --datasets 2 --boot 8 --workers 1
          test -s results/exponential_fit/diagnostics/boot_32/summary.json
          test -s results/exponential_fit/diagnostics/coverage_2_8/coverage_check.json
          git diff --exit-code
